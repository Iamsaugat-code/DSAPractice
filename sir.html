        let currentQuestionIndex = 0;
        let score = 0;
        let userAnswers = new Array(quizData.questions.length).fill(null); // Stores index of selected answer for each question
        let hasAnsweredCurrentQuestion = false;

        const quizContentDiv = document.getElementById('quiz-content');
        const loadingIndicator = document.getElementById('loading-indicator');
        const questionTextElement = document.getElementById('question-text');
        const answerOptionsDiv = document.getElementById('answer-options');
        const feedbackArea = document.getElementById('feedback-area');
        const backButton = document.getElementById('back-button');
        const nextButton = document.getElementById('next-button');
        const resultScreen = document.getElementById('result-screen');
        const finalScoreSpan = document.getElementById('score');
        const totalScoreSpan = document.getElementById('total-score');
        const restartButton = document.getElementById('restart-button');
        const currentQuestionNumberSpan = document.getElementById('current-question-number');
        const totalQuestionsSpan = document.getElementById('total-questions');
        const progressBar = document.getElementById('progress-bar');

        // Function to display a question
        function displayQuestion() {
            // Show quiz content, hide loading
            loadingIndicator.style.display = 'none';
            quizContentDiv.style.display = 'flex';

            const question = quizData.questions[currentQuestionIndex];
            questionTextElement.innerHTML = formatCode(question.question);
            answerOptionsDiv.innerHTML = '';
            feedbackArea.innerHTML = '';
            hasAnsweredCurrentQuestion = userAnswers[currentQuestionIndex] !== null;

            question.answerOptions.forEach((option, index) => {
                const optionDiv = document.createElement('div');
                optionDiv.classList.add('answer-option');
                optionDiv.innerHTML = `
                    <input type="radio" id="option${index}" name="answer" value="${index}" class="w-5 h-5 text-indigo-600 border-gray-300 focus:ring-indigo-500">
                    <label for="option${index}" class="ml-3 text-lg text-gray-800 flex-grow">${option.text}</label>
                `;
                answerOptionsDiv.appendChild(optionDiv);

                if (userAnswers[currentQuestionIndex] === index) {
                    optionDiv.classList.add('selected');
                    optionDiv.querySelector('input').checked = true;
                }

                optionDiv.addEventListener('click', () => selectAnswer(index));
            });

            updateNavigationButtons();
            updateProgressBar();
            updateQuestionNumber();

            if (hasAnsweredCurrentQuestion) {
                showFeedback(quizData.questions[currentQuestionIndex], userAnswers[currentQuestionIndex]);
                disableOptions();
            }
        }

        function selectAnswer(selectedIndex) {
            if (hasAnsweredCurrentQuestion) return; // Prevent changing answer after submission

            const options = Array.from(answerOptionsDiv.children);
            options.forEach((option, index) => {
                option.classList.remove('selected');
                option.querySelector('input').checked = false;
                if (index === selectedIndex) {
                    option.classList.add('selected');
                    option.querySelector('input').checked = true;
                    userAnswers[currentQuestionIndex] = selectedIndex;
                }
            });

            // Immediately show feedback after selecting an answer
            showFeedback(quizData.questions[currentQuestionIndex], selectedIndex);
            disableOptions();
            hasAnsweredCurrentQuestion = true;
        }

        function showFeedback(question, selectedIndex) {
            feedbackArea.innerHTML = '';
            const feedbackDiv = document.createElement('div');
            feedbackDiv.classList.add('feedback-message');

            const correctAnswerIndex = question.answerOptions.findIndex(opt => opt.isCorrect);
            const selectedOption = question.answerOptions[selectedIndex];

            if (selectedOption && selectedOption.isCorrect) {
                feedbackDiv.classList.add('feedback-correct');
                feedbackDiv.textContent = 'Correct! ' + selectedOption.rationale;
                if (userAnswers[currentQuestionIndex] === selectedIndex) { // Only increment score if it's a new correct answer for this question
                     if (!question.answeredCorrectly) {
                         score++;
                         question.answeredCorrectly = true; // Mark question as correctly answered
                     }
                }
            } else {
                feedbackDiv.classList.add('feedback-incorrect');
                let feedbackText = 'Incorrect. ';
                if (selectedOption) {
                    feedbackText += selectedOption.rationale + ' ';
                }
                feedbackText += 'The correct answer was: ' + question.answerOptions[correctAnswerIndex].text;
                feedbackDiv.textContent = feedbackText;
                if (question.answeredCorrectly) { // If previously correct, decrement score as it's now incorrect
                    score--;
                    question.answeredCorrectly = false;
                }
            }
            feedbackArea.appendChild(feedbackDiv);

            // Highlight correct/incorrect answers
            const options = Array.from(answerOptionsDiv.children);
            options.forEach((option, index) => {
                option.classList.remove('selected', 'correct', 'incorrect');
                if (index === correctAnswerIndex) {
                    option.classList.add('correct');
                } else if (index === selectedIndex && !question.answerOptions[selectedIndex].isCorrect) {
                    option.classList.add('incorrect');
                }
            });
        }

        function disableOptions() {
            const options = Array.from(answerOptionsDiv.children);
            options.forEach(option => {
                option.style.pointerEvents = 'none'; // Disable further clicks
                option.querySelector('input').disabled = true; // Disable radio buttons
            });
        }

        function updateNavigationButtons() {
            backButton.disabled = currentQuestionIndex === 0;
            if (currentQuestionIndex === quizData.questions.length - 1) {
                nextButton.textContent = 'Submit Quiz';
            } else {
                nextButton.textContent = 'Next';
            }
        }

        function updateProgressBar() {
            const progress = ((currentQuestionIndex + 1) / quizData.questions.length) * 100;
            progressBar.style.width = `${progress}%`;
        }

        function updateQuestionNumber() {
            currentQuestionNumberSpan.textContent = currentQuestionIndex + 1;
            totalQuestionsSpan.textContent = quizData.questions.length;
        }

        function showResultScreen() {
            quizContentDiv.style.display = 'none';
            resultScreen.style.display = 'flex';
            finalScoreSpan.textContent = score;
            totalScoreSpan.textContent = quizData.questions.length;
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            userAnswers.fill(null);
            quizData.questions.forEach(q => q.answeredCorrectly = false); // Reset answered correctly flag
            resultScreen.style.display = 'none';
            displayQuestion();
        }

        function formatCode(text) {
            // Regular expression to find code blocks marked by ```cpp ... ```
            const codeBlockRegex = /```(cpp|c\+\+)\n([\s\S]*?)\n```/g;
            // Regular expression to find inline code snippets marked by `...` or $...$
            const inlineCodeRegex = /(`([^`]+)`|\$([^\$]+)\$)/g;

            // Replace code blocks first to avoid issues with inline code inside blocks
            let formattedText = text.replace(codeBlockRegex, (match, lang, code) => {
                return `<pre><code>${code.trim()}</code></pre>`;
            });

            // Then replace inline code snippets
            formattedText = formattedText.replace(inlineCodeRegex, (match, p1, p2, p3) => {
                const code = p2 || p3; // p2 for backticks, p3 for dollar signs
                // Basic check to ensure it's not complex LaTeX formulas that shouldn't be treated as code inline
                if (code && !code.includes('\\')) { // Simple check, could be improved
                    return `<code class="bg-gray-200 px-1 py-0.5 rounded">${code.trim()}</code>`;
                }
                return match; // Return original match if it looks like LaTeX
            });

            return formattedText;
        }

        // Event Listeners
        nextButton.addEventListener('click', () => {
            if (currentQuestionIndex < quizData.questions.length - 1) {
                currentQuestionIndex++;
                displayQuestion();
            } else {
                showResultScreen();
            }
        });

        backButton.addEventListener('click', () => {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                displayQuestion();
            }
        });

        restartButton.addEventListener('click', restartQuiz);

        // Initial load
        window.onload = () => {
            displayQuestion();
        };

        // LLM API call structure (not actually used for this local quiz data, but included as per instructions)
        async function callLLMAPI(prompt) {
            let chatHistory = [];
            chatHistory.push({ role: "user", parts: [{ text: prompt }] });
            const payload = { contents: chatHistory };
            const apiKey = ""; // If you want to use models other than gemini-2.5-flash-preview-05-20 or imagen-3.0-generate-002, provide an API key here. Otherwise, leave this as-is.
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;

            let retries = 0;
            const maxRetries = 5;
            let delay = 1000; // 1 second

            while (retries < maxRetries) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (response.status === 429) { // Too Many Requests
                        retries++;
                        await new Promise(res => setTimeout(res, delay));
                        delay *= 2; // Exponential backoff
                        continue;
                    }
                    const result = await response.json();
                    if (result.candidates && result.candidates.length > 0 &&
                        result.candidates[0].content && result.candidates[0].content.parts &&
                        result.candidates[0].content.parts.length > 0) {
                        const text = result.candidates[0].content.parts[0].text;
                        return text;
                    } else {
                        console.error("LLM API response structure unexpected:", result);
                        return null;
                    }
                } catch (error) {
                    console.error("Error calling LLM API:", error);
                    retries++;
                    await new Promise(res => setTimeout(res, delay));
                    delay *= 2;
                }
            }
            console.error("Max retries reached for LLM API call.");
            return null;
